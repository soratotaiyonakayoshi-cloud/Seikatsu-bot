<x-dc>

      </div>

        <div style="font-size: 36px; font-weight: 900;">週の通信簿</div>
        <div style="font-size: 26px; line-height: 1.5; font-weight: 700; color: #4a443d;">達成率ランキングと各賞。早起き賞、ぐっすり賞、そして寝坊賞。</div>
      </div>
      <div style="background: #ffffff; border: 4px solid #1b1815; border-radius: 22px; padding: 30px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 250px;">

      </div>
      <div style="background: #ffffff; border: 4px solid #1b1815; border-radius: 22px; padding: 30px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 250px;">

        <div style="font-size: 36px; font-weight: 900;">メダルがもらえる</div>
        <div style="font-size: 26px; line-height: 1.5; font-weight: 700; color: #4a443d;">守れた日は、仲間の学習アプリ「みんなで暗記！！」でメダルが貯まる。</div>
      </div>
    </div>

    <div style="height: 4px; background: #1b1815;"></div>
