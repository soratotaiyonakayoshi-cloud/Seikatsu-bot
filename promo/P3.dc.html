<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f7f2e8; color: #1b1815; font-family: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", "BIZ UDPGothic", Meiryo, sans-serif; }
    a { color: #d9701a; } a:hover { color: #b85c12; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #f7f2e8; display: flex; flex-direction: column; overflow: hidden;">
  <div style="padding: 72px 80px 56px 80px; display: flex; flex-direction: column; gap: 40px; flex-grow: 1;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 28px; font-weight: 700; color: #d9701a; letter-spacing: 0.06em;">しくみ</span>
      <span style="font-size: 22px; font-weight: 700; color: #6b645b; letter-spacing: 0.08em;">03 / 08</span>
    </div>
    <div style="font-size: 92px; line-height: 1.1; font-weight: 900;">やることは、<br>押すだけ。</div>
    <div style="font-size: 32px; line-height: 1.6; font-weight: 700; color: #4a443d;">Discordのボタンを押すと、それが記録になります。<br>日記も入力も、いりません。</div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px;">
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">☀️ 起きた</span>
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">🍚 ごはん</span>
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">🧹 家事</span>
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">🛁 おふろ</span>
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">🪥 歯磨き</span>
      <span style="display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; background: #ffffff; border: 4px solid #1b1815; border-radius: 16px; font-size: 34px; font-weight: 700;">🌙 おやすみ</span>
    </div>
  </div>

  <div style="background: #1b1815; color: #f7f2e8; padding: 60px 80px 64px 80px; display: flex; flex-direction: column; gap: 32px;">
    <div style="font-size: 72px; font-weight: 900; line-height: 1.1;">毎晩 <span style="color: #f2a349;">23:00</span>、判定。</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
      <div style="border: 3px solid #f2a349; border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 30px; font-weight: 700; color: #f2a349;">守れた日</div>
        <div style="font-size: 34px; font-weight: 900; line-height: 1.35;">「えらい」と言われ、<br>連続日数が伸びる。</div>
      </div>
      <div style="border: 3px solid #f7f2e8; border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 30px; font-weight: 700; color: #f7f2e8; opacity: 0.8;">守れなかった日</div>
        <div style="font-size: 34px; font-weight: 900; line-height: 1.35;">名指しで晒され、<br>みんなに叱られる。</div>
      </div>
    </div>
    <div style="font-size: 26px; font-weight: 700; color: #bdb4a8;">※ 晒しはネタです。叱るときは愛をこめて。</div>
  </div>
</div>
</x-dc>
</body>
</html>
